        // Start Step 2: Restore path from 404 redirect
        (function () {
            const params = new URLSearchParams(window.location.search);
            const path = params.get('path');
            if (path) {
                // Remove the 'path' parameter and any leading slash if necessary
                const decodedPath = decodeURIComponent(path);
                const finalPath = decodedPath.startsWith('/') ? decodedPath.substring(1) : decodedPath;
                // Reconstruct the URL without the 'path' query param
                params.delete('path');
                const search = params.toString();
                const newUrl = window.appBaseHref + finalPath + (search ? '?' + search : '') + window.location.hash;
                window.history.replaceState(null, '', newUrl);
            }
        })();
        // End Step 2
